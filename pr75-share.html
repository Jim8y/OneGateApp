<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneGate share QA</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;padding:24px;background:#f5f7fb;color:#121722}main{max-width:520px;margin:auto}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(20,28,45,.08)}button{appearance:none;border:0;border-radius:10px;background:#2f68ff;color:white;font-weight:700;padding:14px 18px;font-size:16px;width:100%;margin-top:14px}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#dbeafe;padding:14px;border-radius:10px;min-height:96px}.muted{color:#667085;font-size:13px}</style>
</head>
<body>
<main>
  <div class="card">
    <h1>OneGate share QA</h1>
    <p class="muted">Validates <code>window.OneGateDapiProvider.share(request)</code> from inside a dApp WebView.</p>
    <p id="status">Waiting for provider...</p>
    <button id="call">Open Native Share Sheet</button>
    <pre id="result">No result yet.</pre>
  </div>
</main>
<script>
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
function updateStatus(){
  const provider = window.OneGateDapiProvider;
  statusEl.textContent = provider && typeof provider.share === 'function'
    ? 'Provider ready: share is available.'
    : 'Provider missing or share unavailable.';
}
window.addEventListener('Neo.DapiProvider.ready', updateStatus);
setInterval(updateStatus, 750);
updateStatus();
document.getElementById('call').addEventListener('click', async () => {
  resultEl.textContent = 'Calling share...';
  try {
    const result = await window.OneGateDapiProvider.share({
      title: 'OneGate dApp share QA',
      subject: 'OneGate dApp share QA',
      text: 'Shared from a OneGate dApp WebView through OneGateDapiProvider.share().',
      uri: 'https://onegate.space'
    });
    resultEl.textContent = JSON.stringify(result, null, 2);
  } catch (error) {
    resultEl.textContent = 'ERROR: ' + (error && (error.message || JSON.stringify(error)) || error);
  }
});
</script>
</body>
</html>
